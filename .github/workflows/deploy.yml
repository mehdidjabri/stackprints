# Every push to main deploys: the public MCP Worker first (the site binds to it for /mcp), then
# the site, then the admin MCP Worker. Commits the admin MCP makes for your agents land here too,
# so a published change is live a few minutes later. Needs the CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID repository secrets (see mcp/README.md).
#
# The gate is the content check, the site build and the MCP typecheck, plus the MCP tests when the
# push changes code (mcp/, lib/, scripts/): a content commit never waits on, or is blocked by, them.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  # A newer commit makes an older deploy pointless.
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm ci
        working-directory: mcp
      - run: npx tsc -p .
        working-directory: mcp
      - name: Tests, when code changed
        working-directory: mcp
        env:
          BEFORE: ${{ github.event.before }}
          CI: "true"
        run: |
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null && ! git diff --name-only "$BEFORE" HEAD | grep -qE '^(mcp|lib|scripts)/'; then
            echo "Content only: skipping the MCP tests."; exit 0
          fi
          npm run bundle && npx vitest run
      - name: Deploy
        working-directory: mcp
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "No CLOUDFLARE_API_TOKEN secret: skipping deploy."; exit 0; fi
          npm run deploy:public
          npx wrangler deploy -c wrangler.site.jsonc
          npm run deploy:admin
